model:
  model_type: looped
  vocab_size: 4096
  d_model: 128
  n_heads: 4
  head_dim: 32
  n_prelude: 1
  n_core: 1
  n_coda: 1
  n_loops: 4
  loop_encoding: sinusoidal
  loop_sampling: fixed
  min_loops: 1
  max_loops: 16
  use_input_injection: true
  mlp_hidden: 256
  rope_theta: 10000.0
  max_seq_len: 128
  dropout: 0.0
  tie_embeddings: true
  aux_loops: 1
  aux_loss_weight: 0.25

train:
  data_dir: data/tiny_smoke
  out_dir: runs/smoke
  seq_len: 128
  batch_tokens: 4096
  micro_batch_size: 8
  max_steps: 200
  lr: 3.0e-3
  min_lr: 3.0e-4
  warmup_steps: 20
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: bf16
  grad_checkpoint: false
  compile: false
  eval_every: 50
  eval_batches: 10
  save_every: 100
  log_every: 10
  sample_every: 100
  sample_tokens: 60
  seed: 1337
  wandb: false
  wandb_project: looped-lm
